# @package _global_

defaults:
  - /datamodule: decode
  - /trainer: decode_noclip
  - /callbacks
  
#GENERAL
version: 1.0
implementation: "vno12_norm_pos"
comments: "less feed forward, more dimension"
name: "decoder"
model_name: "w2w"

seed: 2024

stage: "finetuning" # pre_training, finetuning, prediction, hyp_tune
ckpt_path: ${last_ckpt:${callbacks.checkpoint.dirpath}} ##a bit weird implementation - fix later
callbacks.checkpoint.dirpath: ${ckpt_path}

#same as pretraining ckpt_path: ${user_path}/${local_path}/checkpoints/${implementation}/${name}/${version}/...
model_path: ././checkpoints/vno12_norm_pos/decoder_dim/1.0/last.ckpt

datamodule:
  batch_size: 8
generate:
  dataloader:
    file_name: pensioner_test_ids.csv
    idx: 3167265
    reps: 8
    samples_per_id: null # null preserves the old reps * batch_size behavior
    trunc_years: 9
    split: test
  sampler:
    num_years: null
    temp: 1.0
    verbose: true

###########################
###################### MODEL
model:
  _target_: src.models.decode.GeneratorDecoder
  _convert_: all
  hparams:
    vocab_size: NULL #this needs to be set at runtime
    n_users: NULL #this needs to be set at runtime
    batch_size: ${datamodule.batch_size}
    max_length: ${datamodule.task.max_length}
    num_epochs: ${trainer.max_epochs}
    accumulate_grad_batches: ${trainer.accumulate_grad_batches}
    seed: ${seed}

    #DECODER PARAMS
    hidden_size: 320 #280 (needs to be divisible by n_heads)
    hidden_ff: 1280 #2210
    hidden_act: "swish"
    n_decoders: 5
    n_heads: 8
    n_local: 6
    local_window_size: 36

    #ENCODER PARAMS
    encoder_hidden_ff: 1280 #2210
    encoder_hidden_act: "swish"
    n_encoders: 1
    encoder_n_heads: 2
    encoder_n_local: 2
    encoder_local_window_size: 8
    encoder_num_random_features: 4

    norm_type: "rms"
    att_dropout: 0.1 ## Attention Layers
    fw_dropout: 0.1 ## Positionwise Layers
    dc_dropout: 0.1 ## Decoder Layer
    emb_dropout: 0.1 ## Embedding dropout
    parametrize_emb: True
    norm_input_emb: False
    norm_output_emb: False
    weight_tying: "wt"
    ## TASK AND LOGS
    training_task: ${datamodule.task.name} # name of the task [mlm, simple]
    experiment_name: ${name}_${model_name}
    experiment_version: ${version} 
    # ## ATTENTION
    attention_type: "performer"
    multihead_dc: False
    num_random_features: 256

    # From trainer args..
    learning_rate: 2.e-4 
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.999
    lr_gamma: 0.8

    cls_num_targs: 3

    smart_positions: false

    epsilon: 1.e-6 #1.e-6
    stage: ${stage}
    implementation: ${implementation}
    version: ${version}

trainer:
  accelerator: 'cpu' #cuda
  devices: 1 #[7]
  callbacks:
    - ${callbacks.checkpoint}
    - ${callbacks.lr_monitor}
    - ${callbacks.grad_norm_monitor}
    # - ${callbacks.silence_warnings}
    - ${callbacks.text_collector}
    - ${callbacks.embedding_collector}
    - ${callbacks.reseed_dataloader}
    - ${callbacks.save_weights}
    - ${callbacks.track_ids}
