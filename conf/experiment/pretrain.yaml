# @package _global_

defaults:
  - /datamodule: pretrain
  - /trainer: pretrain
  - /callbacks
  
#GENERAL
version: 1.0
implementation: "v1"
comments: "clean"
name: "pretraining_encoder"
model_name: "w2v"

seed: 2024

stage: "pre_training" # pre_training, finetuning, prediction, hyp_tune
ckpt_path: ${last_ckpt:${callbacks.checkpoint.dirpath}} ##a bit weird implementation - fix later
callbacks.checkpoint.dirpath: ${ckpt_path}


###########################
###################### MODEL
model:
  _target_: src.models.pretrain.TransformerEncoder
  _convert_: all
  hparams:
    vocab_size: NULL #this needs to be set at runtime
    n_users: NULL #this needs to be set at runtime
    batch_size: ${datamodule.batch_size}
    max_length: ${datamodule.task.max_length}
    num_epochs: ${trainer.max_epochs}
    accumulate_grad_batches: ${trainer.accumulate_grad_batches}
    seed: ${seed}

    hidden_size: 96 #280
    intermediate_size: 128  # size of the position-wise feed-forward layer
    encoder_layers: 2  # number of encoder blocks
    encoder_attention_heads: 4  # number of attention heads in the multiheadattention module
    decoder_layers: 4  # number of decoder blocks
    decoder_attention_heads: 8  # number of attention heads in the multiheadattention module
    hidden_act: "gelu"

    # hidden_ff: 2210
    # hidden_act: "swish"
    # n_encoders: 5
    # n_heads: 10
    # n_local: 7
    # local_window_size: 38

    # norm_type: "rezero"
    att_dropout: 0.1 ## Attention Layers
    fw_dropout: 0.1 ## Positionwise Layers
    dc_dropout: 0.1 ## Decoder Layer
    emb_dropout: 0.1 ## Embedding dropout
    parametrize_emb: True
    norm_input_emb: False
    norm_output_emb: True
    weight_tying: "wt"
    ## TASK AND LOGS
    training_task: ${datamodule.task.name} # name of the task [mlm, simple]
    experiment_name: ${name}_${model_name}
    experiment_version: ${version} 
    # ## ATTENTION
    # attention_type: "performer"
    # multihead_dc: False
    # num_random_features: 436

    # From trainer args..
    learning_rate: 5.e-3 #1.e-3
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.999

    cls_num_targs: 3

    epsilon: 1.e-8 #1.e-6
    stage: ${stage}
    implementation: ${implementation}
    version: ${version}

trainer:
  accelerator: 'gpu'
  devices: 2 #[7]
  callbacks:
    - ${callbacks.checkpoint}
    - ${callbacks.lr_monitor}
    - ${callbacks.grad_norm_monitor}
    # - ${callbacks.silence_warnings}
    - ${callbacks.text_collector}
    - ${callbacks.embedding_collector}
    - ${callbacks.reseed_dataloader}
    - ${callbacks.save_weights}
    - ${callbacks.track_ids}
